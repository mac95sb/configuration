APP_NAME = maclong.dev git

[server]
DOMAIN = git.maclong.dev
ROOT_URL = https://git.maclong.dev/
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3030
DISABLE_SSH = false
START_SSH_SERVER = true
BUILTIN_SSH_SERVER_USER = git
; SSH is local to this Mac. Remote clients use the public HTTPS URL.
SSH_DOMAIN = 127.0.0.1
SSH_PORT = 2222
SSH_LISTEN_HOST = 127.0.0.1
SSH_LISTEN_PORT = 2222

[database]
DB_TYPE = sqlite3
PATH = /Users/svc_forgejo/forgejo-data/data/forgejo.db

[security]
INSTALL_LOCK = true
REVERSE_PROXY_LIMIT = 1
REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.1/32

[service]
DISABLE_REGISTRATION = true

[ui]
DEFAULT_THEME = maclong
THEMES = maclong

[repository]
ROOT = /Users/svc_forgejo/forgejo-data/data/repositories

[metrics]
ENABLED = true
