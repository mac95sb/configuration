auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100

common:
  path_prefix: /Users/svc_observability/loki-data
  storage:
    filesystem:
      chunks_directory: /Users/svc_observability/loki-data/chunks
      rules_directory: /Users/svc_observability/loki-data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-08-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 90d
