auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095

common:
  # Without this the ingester registers its LAN address in the ring and the
  # distributor's gRPC dial to it times out, dropping every write.
  instance_addr: 127.0.0.1
  path_prefix: /Users/svc_observability/loki-data
  storage:
    filesystem:
      chunks_directory: /Users/svc_observability/loki-data/chunks
      rules_directory: /Users/svc_observability/loki-data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-08-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 90d
  discover_service_name: []

# retention_period alone is inert; the compactor is what enforces it.
compactor:
  working_directory: /Users/svc_observability/loki-data/compactor
  retention_enabled: true
  delete_request_store: filesystem
