modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: "ip4"

  # dashboard.maclong.dev sits behind Cloudflare Access, which answers an
  # unauthenticated probe with a redirect to the login page. A redirect proves
  # the origin is up and Access is enforcing; following it would not.
  http_2xx_or_redirect:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: "ip4"
      follow_redirects: false
      valid_status_codes: [200, 302]
