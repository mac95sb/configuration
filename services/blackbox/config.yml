modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: "ip4"

  # Cloudflare Access returns 302 to a healthy unauthenticated probe.
  http_2xx_or_redirect:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: "ip4"
      follow_redirects: false
      valid_status_codes: [302]
