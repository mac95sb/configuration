global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  # Core observability services.
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: "alloy"
    static_configs:
      - targets: ["127.0.0.1:12345"]

  - job_name: "loki"
    static_configs:
      - targets: ["127.0.0.1:3100"]

  - job_name: "blackbox"
    static_configs:
      - targets: ["127.0.0.1:9115"]

  # Application daemons with process metrics for attribution.
  - job_name: "caddy"
    static_configs:
      - targets: ["127.0.0.1:2019"]

  - job_name: "cloudflared"
    static_configs:
      - targets: ["127.0.0.1:20241"]

  - job_name: "grafana"
    static_configs:
      - targets: ["127.0.0.1:3000"]

  - job_name: "forgejo"
    static_configs:
      - targets: ["127.0.0.1:3030"]

  # Direct application health, independent of Cloudflare and Caddy.
  - job_name: "blackbox_local_health"
    metrics_path: /probe
    static_configs:
      - targets: ["http://127.0.0.1:3000/api/health"]
        labels:
          module: http_grafana_health
      - targets: ["http://127.0.0.1:3030/api/healthz"]
        labels:
          module: http_forgejo_health
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Public endpoints through Cloudflare.
  - job_name: "blackbox_http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://status.maclong.dev
          - https://git.maclong.dev
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: "blackbox_access_redirect"
    metrics_path: /probe
    params:
      module: [http_access_redirect]
    static_configs:
      - targets:
          - https://dashboard.maclong.dev
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
