[server]
domain = dashboard.maclong.dev
enforce_domain = true
http_addr = 127.0.0.1
http_port = 3000
root_url = https://dashboard.maclong.dev

[security]
cookie_secure = true

[paths]
provisioning = /Users/mac/Developer/configuration/services/grafana/provisioning

# At info, an open dashboard is the main producer of the logs it displays.
[log]
level = warn
