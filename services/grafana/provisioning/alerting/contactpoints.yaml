apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy_push
        type: webhook
        disableResolveMessage: false
        settings:
          # Secret injected by fnox.
          url: $NTFY_URL
          httpMethod: POST
          headers:
            Title: Homelab alert
            Tags: rotating_light
          # Send readable text instead of Grafana's webhook JSON.
          payload:
            template: |
              {{ .Status }}: {{ .CommonLabels.alertname }}
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ end }}
