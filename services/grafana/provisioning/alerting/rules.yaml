apiVersion: 1

# Remove a provisioned rule with a temporary `deleteRules` entry and restart.

groups:
  - orgId: 1
    name: infrastructure
    folder: Alerts
    interval: 1m
    rules:
      - uid: endpoint_down
        title: HTTP probe failed (public edge or local application)
        condition: threshold
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.instance }} has failed its probe for 5 minutes. The dashboard public probe checks only the Access redirect; local health probes check the applications."
        labels:
          severity: critical
        data:
          - refId: probe
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: probe
              expr: min by (instance) (probe_success)
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: probe
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: scrape_target_down
        title: Scrape target down
        condition: threshold
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}."
        labels:
          severity: critical
        data:
          - refId: target
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: target
              expr: min by (job, instance) (up)
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: target
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: tls_certificate_expiring
        title: TLS certificate expires soon
        condition: threshold
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "The TLS certificate for {{ $labels.instance }} expires in less than 30 days."
        labels:
          severity: warning
        data:
          - refId: remaining
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: remaining
              expr: min by (instance) (probe_ssl_earliest_cert_expiry - time())
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: remaining
              conditions:
                - evaluator: { type: lt, params: [2592000] }

      - uid: log_ingestion_failing
        title: Log ingestion is dropping entries
        condition: threshold
        for: 0m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Alloy is failing to write logs to Loki; log data is being lost."
        labels:
          severity: critical
        data:
          - refId: drops
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: drops
              expr: sum (increase(loki_write_dropped_entries_total[10m]))
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: drops
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: disk_space_low
        title: System or Data filesystem is running out of space
        condition: threshold
        for: 15m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Less than 10% free on {{ $labels.mountpoint }}; observability retention is 90d."
        labels:
          severity: warning
        data:
          - refId: free
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: free
              expr: min by (mountpoint) (node_filesystem_avail_bytes{job="node",mountpoint=~"/|/System/Volumes/Data"} / node_filesystem_size_bytes{job="node",mountpoint=~"/|/System/Volumes/Data"})
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: free
              conditions:
                - evaluator: { type: lt, params: [0.1] }

      - uid: disk_metrics_missing
        title: System or Data filesystem metrics missing
        condition: threshold
        for: 5m
        # Empty absent() results mean all expected series are present.
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Expected filesystem capacity or availability metrics are missing for {{ $labels.mountpoint }}."
        labels:
          severity: warning
        data:
          - refId: missing
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: missing
              expr: absent(node_filesystem_avail_bytes{job="node",mountpoint="/"}) or absent(node_filesystem_size_bytes{job="node",mountpoint="/"}) or absent(node_filesystem_avail_bytes{job="node",mountpoint="/System/Volumes/Data"}) or absent(node_filesystem_size_bytes{job="node",mountpoint="/System/Volumes/Data"})
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: missing
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: soc_metrics_stale
        title: SoC metrics stale or missing
        condition: threshold
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "SoC collection has not completed in 5 minutes, or an expected metric is missing."
        labels:
          severity: warning
        data:
          - refId: unhealthy
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: unhealthy
              expr: (time() - node_textfile_mtime_seconds{job="node",file=~"(.*/)?soc[.]prom"} > bool 300) or absent(node_textfile_mtime_seconds{job="node",file=~"(.*/)?soc[.]prom"}) or absent(host_gpu_utilization_ratio{job="node"}) or absent(host_gpu_memory_bytes{job="node"}) or absent(host_ane_busy_seconds_total{job="node"}) or absent(host_power_watts{job="node"}) or absent(host_battery_charge_ratio{job="node"}) or absent(host_memory_free_ratio{job="node"})
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: unhealthy
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: textfile_collectors_stale
        title: Textfile collector stale, missing or unreadable
        condition: threshold
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "Textfile collector {{ $labels.file }} is over 26 hours old, has disappeared within 7 days, or node_exporter cannot read textfiles. SoC has a separate 5-minute rule; updates use the review timestamp."
        labels:
          severity: warning
        data:
          - refId: unhealthy
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: unhealthy
              expr: (time() - node_textfile_mtime_seconds{job="node",file!~"(.*/)?(soc|updates)[.]prom"} > bool 93600) or ((max_over_time(node_textfile_mtime_seconds{job="node",file!~"(.*/)?updates[.]prom"}[7d]) unless node_textfile_mtime_seconds{job="node"}) * 0 + 1) or node_textfile_scrape_error{job="node"} or absent(node_textfile_scrape_error{job="node"})
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: unhealthy
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: infrastructure_update_review
        title: Infrastructure update review overdue
        condition: threshold
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "Review infrastructure updates on the Mac. The last completed review is over 30 days old or missing. After review, atomically write infrastructure_updates_last_review_seconds to /Users/svc_observability/textfile/updates.prom; do not refresh it on scrape or boot."
        labels:
          severity: warning
        data:
          - refId: age
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: age
              expr: time() - infrastructure_updates_last_review_seconds{job="node"}
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: age
              conditions:
                - evaluator: { type: gt, params: [2592000] }

  - orgId: 1
    name: backup
    folder: Alerts
    interval: 5m
    rules:
      - uid: backup_stale
        title: Backup has not succeeded
        condition: threshold
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "No successful backup run in over 26 hours."
        labels:
          severity: critical
        data:
          - refId: age
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: age
              expr: time() - backup_last_success_seconds
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: age
              conditions:
                - evaluator: { type: gt, params: [93600] }
