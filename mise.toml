[settings]
dotfiles.default_mode = "symlink"
dotfiles.root = "~/Developer/configuration/"
experimental = true

[tools]
# Service tools are pinned. Daemons reach these through /usr/local/bin symlinks
# that resolve to a versioned install path, so an unattended version change
# orphans them. Move these deliberately with `mise upgrade --bump`, which also
# rewrites the pins below; `mise run daemon:relink` then repoints the symlinks.
"aqua:prometheus/prometheus" = "3.14.0"
age = "1.3.1"
caddy = "2.11.4"
cloudflared = "2026.7.3"
fnox = "1.31.1"
"github:grafana/alloy" = "1.18.1"
"github:grafana/loki" = "3.7.6"
"github:prometheus/blackbox_exporter" = "0.28.0"
pitchfork = "2.20.0"
rclone = "1.75.0"
"ubi:prometheus/node_exporter" = "1.12.1"

# User tools track latest. Nothing depends on their exact version, so a plain
# `mise upgrade` moves these and leaves the pinned service tools alone.
hk = "latest"
mas = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
github-cli = "latest"

[hooks]
# A pinned service tool only moves on `mise upgrade --bump`, and when it does the
# /usr/local/bin symlinks still point at the old versioned path. Relink straight
# away when sudo is already available; otherwise say so rather than blocking the
# install on a password prompt.
postinstall = """
case "$MISE_INSTALLED_TOOLS" in
  *age*|*alloy*|*blackbox_exporter*|*caddy*|*cloudflared*|*fnox*|*loki*|*node_exporter*|*pitchfork*|*prometheus*|*rclone*) ;;
  *) exit 0 ;;
esac
if sudo -n true 2>/dev/null; then
  mise run daemon:relink
else
  printf 'mise: a service tool changed version - run `mise run daemon:relink`\n' >&2
fi
"""

[bootstrap.repos]
"~/Developer/configuration" = { url = "https://git.maclong.dev/mac/configuration.git" }
"~/Developer/robin" = { url = "https://git.maclong.dev/mac/robin.git" }

[bootstrap.packages]
"brew-cask:claude" = "latest"                             # Claude
"brew-cask:crossover" = "latest"                          # Crossover
"brew-cask:font-sf-mono-nerd-font-ligaturized" = "latest" # SF Mono
"brew-cask:font-sf-pro" = "latest"                        # SF Pro
"brew-cask:mole-app" = "latest"                           # Mole
# Forgejo and Grafana are service binaries but Homebrew has no version pinning,
# so they cannot join the pinned block in [tools]. Their /usr/local/bin symlinks
# point at stable Homebrew paths, so a version change does not orphan them.
"brew:forgejo" = "latest"   # Forgejo
"brew:grafana" = "latest"   # Grafana
"mas:1289583905" = "latest" # Pixelmator Pro
"mas:1662217862" = "latest" # Wipr 2
"mas:361285480" = "latest"  # Keynote
"mas:361304891" = "latest"  # Numbers
"mas:361309726" = "latest"  # Pages
"mas:424389933" = "latest"  # Final Cut Pro
"mas:424390742" = "latest"  # Compressor
"mas:434290957" = "latest"  # Motion
"mas:497799835" = "latest"  # Xcode
"mas:634148309" = "latest"  # Logic Pro
"mas:634159523" = "latest"  # MainStage

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableTiledWindowMargins = true
GloballyEnabled = true

[bootstrap.macos.launchd.agents.backup-courier]
program = "/Users/mac/Developer/configuration/services/backup/courier.sh"
run_at_load = true
start_interval = 3600
stdout_path = "~/Library/Logs/backup-courier.log"
stderr_path = "~/Library/Logs/backup-courier.log"

[bootstrap.macos.finder]
preferred_view_style = "column"
show_all_files = true
show_pathbar = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[dotfiles]
# Tool configuration.
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/mise/config.toml" = { source = "~/Developer/configuration/mise.toml" }

# Shell and editor configuration.
"~/.config/zsh/.p10k.zsh" = {}
"~/.config/zsh/.zshrc" = {}
"~/.zshenv" = { source = "~/Developer/configuration/.config/zsh/.zshenv" }

[tasks."accounts:install"]
description = "Create service accounts and their required access groups"
run = """
if ! dscl . -read /Groups/fnox >/dev/null 2>&1; then
  sudo dseditgroup -o create fnox
fi
if ! dscl . -read /Groups/observability >/dev/null 2>&1; then
  sudo dseditgroup -o create observability
fi
if ! dscl . -read /Users/svc_backup >/dev/null 2>&1; then
  sudo sysadminctl -addUser svc_backup -fullName "Backup service account" -shell /usr/bin/false -roleAccount
fi
if ! dscl . -read /Users/svc_caddy >/dev/null 2>&1; then
  sudo sysadminctl -addUser svc_caddy -fullName "Caddy service account" -shell /usr/bin/false -roleAccount
fi
if ! dscl . -read /Users/svc_cloudflared >/dev/null 2>&1; then
  sudo sysadminctl -addUser svc_cloudflared -fullName "Cloudflared service account" -shell /usr/bin/false -roleAccount
fi
if ! dscl . -read /Users/svc_forgejo >/dev/null 2>&1; then
  sudo sysadminctl -addUser svc_forgejo -fullName "Forgejo service account" -shell /usr/bin/false -roleAccount
fi
if ! dscl . -read /Users/svc_observability >/dev/null 2>&1; then
  sudo sysadminctl -addUser svc_observability -fullName "Observability service account" -shell /usr/bin/false -roleAccount
fi
sudo dseditgroup -o edit -a svc_backup -t user fnox
sudo dseditgroup -o edit -a svc_forgejo -t user fnox
sudo dseditgroup -o edit -a svc_observability -t user fnox
sudo dseditgroup -o edit -a svc_observability -t user observability
sudo dseditgroup -o edit -a svc_backup -t user observability
sudo install -d -m 750 -o svc_backup -g staff /Users/svc_backup/backup-staging
sudo dseditgroup -o edit -a mac -t user observability
sudo install -d -m 775 -o svc_observability -g observability /Users/svc_observability/textfile
"""

[tasks.check]
description = "Run hk's quality gate"
run = "hk check"

[tasks."daemon:install"]
description = "Point pitchfork's global config at this repo, expose binaries service accounts need, and register boot start"
depends = ["daemon:relink"]
run = """
sudo install -d -m 755 -o root -g wheel /etc/pitchfork
if [ ! /Users/mac/Developer/configuration/pitchfork.toml -ef /etc/pitchfork/config.toml ]; then
  sudo install -o root -g wheel -m 644 \
    /Users/mac/Developer/configuration/pitchfork.toml /etc/pitchfork/config.toml
fi
sudo chmod o+x /Users/mac
sudo install -d -m 750 -o svc_caddy -g observability /var/log/caddy
sudo install -d -m 750 -o mac -g observability /var/log/services
sudo install -o root -g wheel -m 644 \
  /Users/mac/Developer/configuration/services/logs/newsyslog.conf \
  /etc/newsyslog.d/services.conf
sudo pitchfork boot enable

# pitchfork writes its own versioned install path into the plist, so a version
# bump would silently orphan boot start. Repoint it at the stable symlink and
# keep the supervisor restarting if it dies.
plist=/Library/LaunchDaemons/pitchfork.plist
sudo /usr/libexec/PlistBuddy -c 'Set :ProgramArguments:0 /usr/local/bin/pitchfork' "$plist"
sudo /usr/libexec/PlistBuddy -c 'Add :KeepAlive bool true' "$plist" 2>/dev/null ||
  sudo /usr/libexec/PlistBuddy -c 'Set :KeepAlive true' "$plist"
"""

[tasks."daemon:relink"]
description = "Repoint /usr/local/bin at the current service binaries after a version change"
run = """
# Copy rather than symlink. /usr/local/bin/pitchfork is the root LaunchDaemon's
# executable, so a link into the mac-owned mise tree would let anything running
# as mac take root at the next boot with no Touch ID prompt in the way.
for bin in age alloy blackbox_exporter caddy cloudflared fnox loki node_exporter pitchfork prometheus rclone; do
  sudo install -o root -g wheel -m 755 "$(mise which "$bin")" "/usr/local/bin/$bin"
done

# These stay symlinks: grafana resolves its homepath tree relative to the
# Homebrew prefix, and neither of them is ever executed as root.
sudo ln -sf /opt/homebrew/bin/forgejo /usr/local/bin/forgejo
sudo ln -sf /opt/homebrew/bin/grafana /usr/local/bin/grafana
"""

[tasks."daemon:reload"]
description = "Install the edited pitchfork.toml as root and restart all daemons"
run = """
# Update copied configs; symlinked setups already read the checkout directly.
if [ ! /Users/mac/Developer/configuration/pitchfork.toml -ef /etc/pitchfork/config.toml ]; then
  sudo install -o root -g wheel -m 644 \
    /Users/mac/Developer/configuration/pitchfork.toml /etc/pitchfork/config.toml
fi
pitchfork restart --all-global
"""

[tasks.fix]
description = "Run hk's quality gate with fixes applied"
run = "hk fix"

[tasks."mail:install"]
description = "Configure the built-in Postfix for local, direct outbound mail"
run = "/Users/mac/Developer/configuration/services/mail/install.sh"

[tasks."mail:dns"]
description = "Print the DNS records required for direct outbound mail"
run = "/Users/mac/Developer/configuration/services/mail/dns.sh"

[tasks."mail:test"]
description = "Send a direct-delivery test message"
run = "/Users/mac/Developer/configuration/services/mail/test.sh"
