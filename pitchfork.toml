[settings.supervisor]
user = "mac"

[daemons.caddy]
user = "svc_caddy"
dir = "/Users/mac/Developer/configuration"
boot_start = true
run = "/usr/local/bin/caddy run --config Caddyfile"

[daemons.cloudflared]
user = "svc_caddy"
dir = "/Users/mac/Developer/configuration"
boot_start = true
run = "/usr/local/bin/cloudflared --config cloudflared.yml tunnel run"

[daemons.blackbox]
user = "svc_observability"
dir = "/Users/mac/Developer/configuration"
boot_start = true
run = "/usr/local/bin/blackbox_exporter --config.file=blackbox.yml"
