[settings.supervisor]
user = "mac"

[daemons.caddy]
user = "svc_caddy"
boot_start = true
env = { HOME = "/Users/svc_caddy" }
run = "/usr/local/bin/caddy run --config /Users/mac/Developer/configuration/services/caddy/Caddyfile"

[daemons.cloudflared]
user = "svc_cloudflared"
boot_start = true
run = "/Users/mac/Developer/configuration/services/cloudflared/start.sh"

[daemons.node_exporter]
user = "svc_observability"
boot_start = true
run = "/usr/local/bin/node_exporter --web.listen-address=127.0.0.1:9101"

[daemons.blackbox]
user = "svc_observability"
boot_start = true
run = "/usr/local/bin/blackbox_exporter --config.file=/Users/mac/Developer/configuration/services/blackbox/config.yml --web.listen-address=127.0.0.1:9115"

[daemons.prometheus]
user = "svc_observability"
boot_start = true
run = "/usr/local/bin/prometheus --config.file=/Users/mac/Developer/configuration/services/prometheus/config.yml --storage.tsdb.path=/Users/svc_observability/prometheus-data --storage.tsdb.retention.time=90d --web.listen-address=127.0.0.1:9090"

[daemons.loki]
user = "svc_observability"
boot_start = true
run = "/usr/local/bin/loki -config.file=/Users/mac/Developer/configuration/services/loki/config.yml"

[daemons.alloy]
user = "svc_observability"
boot_start = true
depends = ["loki"]
run = "/usr/local/bin/fnox exec --config /Users/mac/Developer/configuration/fnox.toml --profile observability -- /usr/local/bin/alloy run /Users/mac/Developer/configuration/services/alloy/config.alloy --storage.path=/Users/svc_observability/alloy-data --server.http.listen-addr=127.0.0.1:12345"

[daemons.grafana]
user = "svc_observability"
boot_start = true
depends = ["prometheus", "loki"]
run = "/usr/local/bin/fnox exec --config /Users/mac/Developer/configuration/fnox.toml --profile grafana -- /usr/local/bin/grafana server --config=/Users/mac/Developer/configuration/services/grafana/config.ini --homepath=/opt/homebrew/opt/grafana/share/grafana --packaging=brew cfg:default.paths.logs=/Users/svc_observability/grafana-logs cfg:default.paths.data=/Users/svc_observability/grafana-data cfg:default.paths.plugins=/Users/svc_observability/grafana-plugins"

[daemons.forgejo]
user = "svc_forgejo"
boot_start = true
env = { HOME = "/Users/svc_forgejo" }
run = "/usr/local/bin/fnox exec --config /Users/mac/Developer/configuration/fnox.toml --profile forgejo -- /Users/mac/Developer/configuration/services/forgejo/start.sh"
