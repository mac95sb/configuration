[settings.general]
shell = "/bin/sh -c"
mise = false

[settings.supervisor]
user = "root"

[daemons.caddy]
user = "svc_caddy"
boot_start = true
env = { HOME = "/Users/svc_caddy" }
run = "/usr/local/bin/caddy run --config /Users/mac/Developer/configuration/services/caddy/Caddyfile"

[daemons.cloudflared]
user = "svc_cloudflared"
boot_start = true
run = "/usr/local/bin/cloudflared --config /Users/mac/Developer/configuration/services/cloudflared/config.yml tunnel run"

[daemons.node_exporter]
user = "svc_observability"
boot_start = true
run = "/usr/local/bin/node_exporter --web.listen-address=127.0.0.1:9101 --collector.textfile.directory=/Users/svc_observability/textfile --no-collector.thermal"

[daemons.soc_metrics]
user = "svc_observability"
boot_start = true
cron = { schedule = "0 * * * * *", retrigger = "finish" }
run = "/bin/sh /usr/local/libexec/mac-server/tasks/metrics/soc"

[daemons.blackbox]
user = "svc_observability"
boot_start = true
run = "/usr/local/bin/blackbox_exporter --config.file=/Users/mac/Developer/configuration/services/blackbox/config.yml --web.listen-address=127.0.0.1:9115 --log.prober=error"

[daemons.prometheus]
user = "svc_observability"
boot_start = true
run = "/usr/local/bin/prometheus --config.file=/Users/mac/Developer/configuration/services/prometheus/config.yml --storage.tsdb.path=/Users/svc_observability/prometheus-data --storage.tsdb.retention.time=90d --web.listen-address=127.0.0.1:9090"

[daemons.loki]
user = "svc_observability"
boot_start = true
run = "/usr/local/bin/loki -config.file=/Users/mac/Developer/configuration/services/loki/config.yml"

[daemons.alloy]
user = "root"
boot_start = true
depends = ["loki"]
run = "/bin/sh /usr/local/libexec/mac-server/tasks/security/service alloy"

[daemons.grafana]
user = "root"
boot_start = true
depends = ["prometheus", "loki"]
run = "/bin/sh /usr/local/libexec/mac-server/tasks/security/service grafana"

[daemons.forgejo]
user = "root"
boot_start = true
run = "/bin/sh /usr/local/libexec/mac-server/tasks/security/service forgejo"

[daemons.log_shipper_pitchfork]
user = "root"
boot_start = true
run = "/bin/sh /usr/local/libexec/mac-server/tasks/logs/pitchfork"

[daemons.log_shipper_postfix]
user = "mac"
boot_start = true
run = "/bin/sh /usr/local/libexec/mac-server/tasks/logs/postfix"

[daemons.backup]
user = "root"
boot_start = true
cron = { schedule = "0 0 3 * * *", retrigger = "finish" }
run = "/bin/sh /usr/local/libexec/mac-server/tasks/backup/operate checkpoint"
