[settings.supervisor]
user = "mac"

[daemons.caddy]
user = "svc_caddy"
dir = "/Users/mac/Developer/configuration"
boot_start = true
run = "/usr/local/bin/caddy run --config Caddyfile"

[daemons.cloudflared]
user = "svc_caddy"
dir = "/Users/mac/Developer/configuration"
boot_start = true
run = "/usr/local/bin/cloudflared --config cloudflared.yml tunnel run"

[daemons.blackbox]
user = "svc_observability"
dir = "/Users/mac/Developer/configuration"
boot_start = true
run = "/usr/local/bin/blackbox_exporter --config.file=blackbox.yml --web.listen-address=127.0.0.1:9115"

[daemons.prometheus]
user = "svc_observability"
dir = "/Users/mac/Developer/configuration"
boot_start = true
run = "/usr/local/bin/prometheus --config.file=prometheus.yml --storage.tsdb.path=/Users/svc_observability/prometheus-data --storage.tsdb.retention.time=90d --web.listen-address=127.0.0.1:9090"

[daemons.loki]
user = "svc_observability"
dir = "/Users/mac/Developer/configuration"
boot_start = true
run = "/usr/local/bin/loki -config.file=loki-config.yaml"

[daemons.alloy]
user = "svc_observability"
dir = "/Users/mac/Developer/configuration"
boot_start = true
depends = ["loki"]
run = "/usr/local/bin/fnox exec --profile observability -- /usr/local/bin/alloy run config.alloy --storage.path=/Users/svc_observability/alloy-data --server.http.listen-addr=127.0.0.1:12345"

[daemons.grafana]
user = "svc_observability"
dir = "/Users/mac/Developer/configuration"
boot_start = true
depends = ["prometheus", "loki"]
run = "/usr/local/bin/grafana server --config=grafana.ini --homepath=/opt/homebrew/opt/grafana/share/grafana --packaging=brew cfg:default.paths.logs=/Users/svc_observability/grafana-logs cfg:default.paths.data=/Users/svc_observability/grafana-data cfg:default.paths.plugins=/Users/svc_observability/grafana-plugins"
