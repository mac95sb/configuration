[settings]
dotfiles.default_mode = "symlink"
dotfiles.root = "~/Developer/configuration/"
experimental = true

[tools]
claude = "latest"
gh = "latest"
mas = "latest"
node = "latest"
"npm:agent-browser" = "latest"
pkl = "latest"

[bootstrap.repos]
"~/Developer/configuration" = { url = "https://github.com/mac95sb/configuration" }
"~/Developer/todo-example" = { url = "https://github.com/mac95sb/todo-example" }
"~/Developer/skills" = { url = "https://github.com/mac95sb/skills" }

[bootstrap.packages]
# Fonts.
"brew-cask:font-sf-mono-nerd-font-ligaturized" = "latest"
"brew-cask:font-sf-pro" = "latest"

# Developer tools & utilities.
"brew-cask:mole-app" = "latest" # Mole
"brew-cask:obscura-vpn" = "latest" # Obscura VPN
"brew-cask:orbstack" = "latest" # OrbStack
"brew-cask:postico" = "latest" # Postico
"brew-cask:zed" = "latest" # Zed Editor
"mas:497799835" = "latest"  # Xcode

# Productivity & design.
"mas:1289583905" = "latest" # Pixelmator Pro
"mas:1662217862" = "latest" # Wipr 2
"mas:361285480" = "latest"  # Keynote
"mas:361304891" = "latest"  # Numbers
"mas:361309726" = "latest"  # Pages

# Media & entertainment.
"brew-cask:crossover" = "latest" # Crossover
"mas:424389933" = "latest"  # Final Cut Pro
"mas:424390742" = "latest"  # Compressor
"mas:434290957" = "latest"  # Motion
"mas:634148309" = "latest"  # Logic Pro
"mas:634159523" = "latest"  # MainStage

[bootstrap.macos.defaults."com.apple.WindowManager"]
GloballyEnabled = true
EnableTiledWindowMargins = true

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "column"

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[tasks.skills]
description = "Install shared agent skills with skills.sh."
run = """
npx --yes skills add n0an/App-Intents-Agent-Skill --global --agent zed --skill app-intents --copy --yes
npx --yes skills add AvdLee/Core-Data-Agent-Skill --global --agent zed --skill core-data-expert --copy --yes
npx --yes skills add dadederk/iOS-Accessibility-Agent-Skill --global --agent zed --skill ios-accessibility --copy --yes
npx --yes skills add jazzychad/ios-code-audit --global --agent zed --skill ios-code-audit --copy --yes
npx --yes skills add conorluddy/ios-simulator-skill --global --agent zed --skill ios-simulator-skill --copy --yes
npx --yes skills add efremidze/swift-architecture-skill --global --agent zed --skill swift-architecture-skill --copy --yes
npx --yes skills add twostraws/Swift-Concurrency-Agent-Skill --global --agent zed --skill swift-concurrency-pro --copy --yes
npx --yes skills add ivan-magda/swift-security-skill --global --agent zed --skill swift-security-expert --copy --yes
npx --yes skills add twostraws/Swift-Testing-Agent-Skill --global --agent zed --skill swift-testing-pro --copy --yes
npx --yes skills add twostraws/SwiftData-Agent-Skill --global --agent zed --skill swiftdata-pro --copy --yes
npx --yes skills add twostraws/SwiftUI-Agent-Skill --global --agent zed --skill swiftui-pro --copy --yes
npx --yes skills add denoland/skills --global --agent zed --skill deno --copy --yes
npx --yes skills add claude-office-skills/skills --global --agent zed --skill '*' --copy --yes
npx --yes skills add mac95sb/skills --global --agent zed --skill '*' --copy --yes
for skill_dir in "$HOME"/.agents/skills/*; do
  [ -d "$skill_dir" ] || continue

  skill_name=${skill_dir##*/}
  normalized_name=$(printf '%s\n' "$skill_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9][^a-z0-9]*/-/g; s/^-//; s/-$//')
  [ -n "$normalized_name" ] || continue

  normalized_dir=${skill_dir%/*}/$normalized_name
  if [ "$skill_dir" != "$normalized_dir" ]; then
    rm -rf "$normalized_dir"
    mv "$skill_dir" "$normalized_dir"
  fi

  skill_file=$normalized_dir/SKILL.md
  [ -f "$skill_file" ] || continue
  tmp_file=${skill_file}.tmp

  awk -v skill_name="$normalized_name" '
    NR == 1 && $0 == "---" { in_frontmatter = 1 }
    in_frontmatter && NR > 1 && $0 == "---" { in_frontmatter = 0 }
    in_frontmatter && !renamed && /^name:/ {
      print "name: " skill_name
      renamed = 1
      next
    }
    { print }
  ' "$skill_file" > "$tmp_file" && mv "$tmp_file" "$skill_file"
  [ ! -f "$tmp_file" ] || rm -f "$tmp_file"
done
"""

[dotfiles]
# Agent instructions.
"~/.agents/AGENTS.md" = { source = "~/Developer/configuration/AGENTS.md" }

# Tool configuration.
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/mise/config.toml" = {}

# Shell and editor configuration.
"~/.config/zed/keymap.json" = {}
"~/.config/zed/settings.json" = {}
"~/.config/zsh/.p10k.zsh" = {}
"~/.config/zsh/.zshrc" = {}
"~/.vimrc" = {}
"~/.zshenv" = { source = "~/Developer/configuration/.config/zsh/.zshenv" }
