[settings]
dotfiles.default_mode = "symlink"
dotfiles.root = "~/Developer/configuration/"
experimental = true

[tools]
gh = "latest"
go = "latest"
mas = "latest"
node = "latest"
opencode = "latest"
pkl = "latest"
wrangler = "latest"

[bootstrap.repos]
"~/Developer/configuration" = { url = "https://github.com/mac95sb/configuration" }
"~/Developer/skills" = { url = "https://github.com/mac95sb/skills" }

[bootstrap.packages]
# Fonts.
"brew-cask:font-sf-mono-nerd-font-ligaturized" = "latest"
"brew-cask:font-sf-pro" = "latest"

# Developer tools & utilities.
"brew-cask:mole-app" = "latest" # Mole
"brew-cask:obscura-vpn" = "latest" # Obscura VPN
"brew-cask:postico" = "latest" # Postico
"brew-cask:zed" = "latest" # Zed Editor
"mas:497799835" = "latest"  # Xcode

# Productivity & design.
"mas:1289583905" = "latest" # Pixelmator Pro
"mas:1662217862" = "latest" # Wipr 2
"mas:361285480" = "latest"  # Keynote
"mas:361304891" = "latest"  # Numbers
"mas:361309726" = "latest"  # Pages

# Media & entertainment.
"brew-cask:crossover" = "latest" # Crossover
"mas:424389933" = "latest"  # Final Cut Pro
"mas:424390742" = "latest"  # Compressor
"mas:434290957" = "latest"  # Motion
"mas:634148309" = "latest"  # Logic Pro
"mas:634159523" = "latest"  # MainStage

[bootstrap.macos.defaults."com.apple.WindowManager"]
GloballyEnabled = true
EnableTiledWindowMargins = true

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "column"

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[tasks.skills]
description = "Install shared agent skills with skills.sh."
run = """
for entry in \
  'n0an/App-Intents-Agent-Skill:app-intents' \
  'AvdLee/Core-Data-Agent-Skill:core-data-expert' \
  'dadederk/iOS-Accessibility-Agent-Skill:ios-accessibility' \
  'jazzychad/ios-code-audit:ios-code-audit' \
  'conorluddy/ios-simulator-skill:ios-simulator-skill' \
  'efremidze/swift-architecture-skill:swift-architecture-skill' \
  'twostraws/Swift-Concurrency-Agent-Skill:swift-concurrency-pro' \
  'ivan-magda/swift-security-skill:swift-security-expert' \
  'twostraws/Swift-Testing-Agent-Skill:swift-testing-pro' \
  'twostraws/SwiftData-Agent-Skill:swiftdata-pro' \
  'twostraws/SwiftUI-Agent-Skill:swiftui-pro' \
  'denoland/skills:deno' \
  'claude-office-skills/skills:*' \
  'mac95sb/skills:*' \
  'ayghri/i-have-adhd:i-have-adhd' \
  'cloudflare/skills:*'
do
  repo=${entry%%:*}
  skill=${entry#*:}
  npx --yes skills add "$repo" --global --agent zed codex claude-code --skill "$skill" --copy --yes
done

for skills_dir in "$HOME/.agents/skills" "$HOME/.claude/skills"; do
  for skill_dir in "$skills_dir"/*; do
    [ -d "$skill_dir" ] || continue

    skill_name=${skill_dir##*/}
    normalized_name=$(printf '%s\n' "$skill_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9][^a-z0-9]*/-/g; s/^-//; s/-$//')
    [ -n "$normalized_name" ] || continue

    normalized_dir=${skill_dir%/*}/$normalized_name
    if [ "$skill_dir" != "$normalized_dir" ]; then
      rm -rf "$normalized_dir"
      mv "$skill_dir" "$normalized_dir"
    fi

    skill_file=$normalized_dir/SKILL.md
    [ -f "$skill_file" ] || continue
    tmp_file=${skill_file}.tmp

    awk -v skill_name="$normalized_name" '
      NR == 1 && $0 == "---" { in_frontmatter = 1 }
      in_frontmatter && NR > 1 && $0 == "---" { in_frontmatter = 0 }
      in_frontmatter && !renamed && /^name:/ {
        print "name: " skill_name
        renamed = 1
        next
      }
      { print }
    ' "$skill_file" > "$tmp_file" && mv "$tmp_file" "$skill_file"
    [ ! -f "$tmp_file" ] || rm -f "$tmp_file"
  done
done
"""

[dotfiles]
# Agent instructions.
"~/.agents/AGENTS.md" = { source = "~/Developer/configuration/AGENTS.md" }
"~/.codex/AGENTS.md" = { source = "~/Developer/configuration/AGENTS.md" }
"~/.claude/CLAUDE.md" = { source = "~/Developer/configuration/AGENTS.md" }

# Tool configuration.
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/mise/config.toml" = {}

# Shell and editor configuration.
"~/.config/zed/keymap.json" = {}
"~/.config/zed/settings.json" = {}
"~/.config/zsh/.p10k.zsh" = {}
"~/.config/zsh/.zshrc" = {}
"~/.vimrc" = {}
"~/.zshenv" = { source = "~/Developer/configuration/.config/zsh/.zshenv" }
